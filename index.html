    <style>
        /* Fix iOS Safari 100vh bug — usa variável CSS atualizada via JS */
        :root {
            --app-height: 100%;
        }

        html {
            height: 100%;
            height: -webkit-fill-available; /* iOS Safari fallback */
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        typebot-standard {
            display: block;
            width: 100%;
            /* dvh = dynamic viewport height — desconta barra do browser automaticamente */
            height: 100dvh;
            /* Fallback para browsers que não suportam dvh */
            height: var(--app-height);
            /* Garante área segura em iPhones com notch/home indicator */
            padding-bottom: env(safe-area-inset-bottom);
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <script>
        // Calcula altura real da janela e atualiza CSS var — resolve iOS Safari 100vh bug
        function setAppHeight() {
            document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', function() {
            setTimeout(setAppHeight, 150); // delay para iOS terminar a rotação
        });
    </script>
