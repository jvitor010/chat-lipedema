    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        /*
         * iOS Safari: 100vh inclui a barra do browser → conteúdo fica maior que o visível.
         * -webkit-fill-available resolve isso: usa apenas a altura VISÍVEL.
         */
        html {
            height: 100%;
            height: -webkit-fill-available;
        }

        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121B22;
        }

        typebot-standard {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>

    <script>
        /*
         * Fallback JS: força a altura real do viewport como variável CSS
         * e aplica diretamente no <html> para garantir que height:100%
         * no body e no typebot-standard herdem o valor correto.
         */
        function applyRealHeight() {
            var h = window.innerHeight;
            document.documentElement.style.height = h + 'px';
        }

        applyRealHeight();
        window.addEventListener('resize', applyRealHeight);
        window.addEventListener('orientationchange', function () {
            setTimeout(applyRealHeight, 200);
        });

        /*
         * Injeção de CSS no shadow DOM do Typebot.
         * CSS externo NÃO penetra shadow DOM — precisa ser injetado via <style> internamente.
         * Apenas força height:100% sem alterar position, para não causar recorte.
         */
        function injectShadowStyle() {
            var tb = document.querySelector('typebot-standard');
            if (!tb || !tb.shadowRoot) {
                setTimeout(injectShadowStyle, 150);
                return;
            }
            if (tb.shadowRoot.getElementById('fv-height-fix')) return;

            var style = document.createElement('style');
            style.id = 'fv-height-fix';
            style.textContent =
                '.typebot-container {' +
                '  height: 100% !important;' +
                '  max-height: 100% !important;' +
                '  overflow: hidden !important;' +
                '}';
            tb.shadowRoot.appendChild(style);
        }

        injectShadowStyle();
    </script>
</head>
