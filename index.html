    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121B22;
        }

        /* position:fixed;inset:0 é a única abordagem 100% confiável em todos os browsers mobile */
        typebot-standard {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <script>
        // Injeta CSS diretamente no shadow DOM do typebot assim que ele montar
        // CSS externo não penetra shadow DOM — precisa ser injetado internamente
        function injectShadowCSS() {
            var tb = document.querySelector('typebot-standard');
            if (!tb) { setTimeout(injectShadowCSS, 100); return; }
            if (!tb.shadowRoot) { setTimeout(injectShadowCSS, 100); return; }

            var container = tb.shadowRoot.querySelector('.typebot-container');
            if (!container) { setTimeout(injectShadowCSS, 100); return; }

            // Força o container interno a preencher toda a altura real da janela
            var h = window.innerHeight;
            container.style.cssText = [
                'position: fixed',
                'top: 0',
                'left: 0',
                'right: 0',
                'bottom: 0',
                'width: 100%',
                'height: ' + h + 'px',
                'overflow: hidden'
            ].join(' !important; ') + ' !important;';

            // Re-aplica ao redimensionar (rotação de tela, teclado virtual)
            window.addEventListener('resize', function() {
                container.style.height = window.innerHeight + 'px !important';
            });

            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', function() {
                    container.style.height = window.visualViewport.height + 'px !important';
                });
            }
        }

        // Cria div #__next que o script chatecom precisa para inserir a barra de cabeçalho
        var nextDiv = document.createElement('div');
        nextDiv.id = '__next';
        nextDiv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;overflow:hidden;';
        document.body.appendChild(nextDiv);

        // Inicia a tentativa de injeção no shadow DOM
        injectShadowCSS();
    </script>

    <script type="module">
        import Typebot from 'https://cdn.jsdelivr.net/npm/@typebot.io/js@0/dist/web.js';

        Typebot.initStandard({
            typebot: "lipedema-sem-complica-es-1nwkaag",
            apiHost: "https://chat.chatecom.me",
        });
    </script>

    <typebot-standard></typebot-standard>

</body>
